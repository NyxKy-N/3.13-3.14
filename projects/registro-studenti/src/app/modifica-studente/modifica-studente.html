<!--
  PROVA TU — LIVELLO 3 — modifica-studente.html
  È "lo stesso form dell'inserimento", con due differenze:
   - i signal sono già compilati con i dati dello studente (lo fa ngOnInit);
   - Salva chiama aggiorna() e naviga al dettaglio, e c'è anche Annulla.
  Restano valide le regole della traccia: name su ogni campo dentro <form>,
  #modulo="ngForm", validazione required/min/max e [disabled]="modulo.invalid".
-->
<h2>Modifica studente</h2>

<form #modulo="ngForm" (ngSubmit)="salva()" class="p-4 bg-body-tertiary rounded-3">
  <div class="mb-3">
    <label for="nome" class="form-label">Nome e cognome</label>
    <input id="nome" name="nome" class="form-control" [(ngModel)]="nome" required />
  </div>

  <div class="mb-3">
    <label for="classe" class="form-label">Classe</label>
    <input id="classe" name="classe" class="form-control" [(ngModel)]="classe" required />
  </div>

  <div class="mb-3">
    <label for="media" class="form-label">Media dei voti</label>
    <input
      id="media"
      name="media"
      type="number"
      class="form-control"
      [(ngModel)]="media"
      required
      min="1"
      max="10"
      step="0.1"
    />
  </div>

  <button type="submit" class="btn btn-primary" [disabled]="modulo.invalid">Salva</button>
  <button type="button" class="btn btn-outline-secondary ms-2" (click)="annulla()">Annulla</button>
</form>
